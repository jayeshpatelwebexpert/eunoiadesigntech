
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GSAP Marquee Animation | Eunoia Design Tech</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/eunoiadesigntech_style.css">
    <link rel="stylesheet" href="assets/css/style.css">

    <style>
        /* DEMO SECTION */
        .marquee-section {
            width: 100%;
            overflow: hidden;
            padding: 55px 0;
            background: #000;
        }

        .marquee-track {
            display: flex;
            width: max-content;
            will-change: transform;
        }

        .marquee-content {
            display: flex;
            align-items: center;
            flex-shrink: 0;
            gap: 45px;
            padding-right: 45px;
            white-space: nowrap;
        }

        .marquee-content span {
            color: #fff;
            font-family: "Open Sans", sans-serif;
            font-size: clamp(40px, 6vw, 85px);
            font-weight: 700;
            line-height: 1;
            text-transform: uppercase;
        }

        .marquee-content .marquee-star {
            color: #aaa;
            font-size: clamp(35px, 5vw, 60px);
        }

        @media (max-width: 767px) {
            .marquee-section {
                padding: 30px 0;
            }

            .marquee-content {
                gap: 22px;
                padding-right: 22px;
            }
        }
    </style>

</head>

<body>


    <!-- MAIN CONTENT -->
    <main>

  
     

        <!-- MARQUEE SECTION START -->
        <section class="marquee-section">

            <div class="marquee-track">

                <!-- First Group -->
                <div class="marquee-content">

                    <span>Web Design</span>
                    <span class="marquee-star">✳</span>

                    <span>Development</span>
                    <span class="marquee-star">✳</span>

                    <span>UI/UX Design</span>
                    <span class="marquee-star">✳</span>

                    <span>Creative Solutions</span>
                    <span class="marquee-star">✳</span>

                </div>

                <!-- Duplicate Group for Infinite Loop -->
                <div class="marquee-content" aria-hidden="true">

                    <span>Web Design</span>
                    <span class="marquee-star">✳</span>

                    <span>Development</span>
                    <span class="marquee-star">✳</span>

                    <span>UI/UX Design</span>
                    <span class="marquee-star">✳</span>

                    <span>Creative Solutions</span>
                    <span class="marquee-star">✳</span>

                </div>

            </div>

        </section>
        <!-- MARQUEE SECTION END -->


        <!-- ABOUT SECTION -->
        <section class="about-section">
            <div class="container">
                <h2>About Our Agency</h2>
                <p>
                    We help businesses build meaningful digital
                    experiences through creative design and development.
                </p>
            </div>
        </section>


    </main>


    <!-- jQuery -->
    <script src="assets/js/jquery-4.0.0.js"></script>

    <!-- Bootstrap JS -->
    <script src="assets/js/popper.min.js"></script>
    <script src="assets/js/bootstrap.min.js"></script>

    <!-- GSAP -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>

    <!-- ScrollTrigger -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/ScrollTrigger.min.js"></script>

    <!-- Lenis Smooth Scroll -->
    <script src="https://cdn.jsdelivr.net/npm/lenis@1.3.11/dist/lenis.min.js"></script>

    <!-- Custom JS -->
    <script src="assets/js/eunoiadesigntech_custom.js"></script>


</body>
</html>
